server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.wasm is 41 MB raw and 9 MB gzipped. The .gz files are built ahead of
    # time and served directly - compressing 41 MB per request would be absurd.
    # "always": serve the precompressed .gz whatever the client asked for. The
    # reverse proxy in front does not reliably pass Accept-Encoding through, and
    # every browser that can run a Godot 4 wasm build accepts gzip.
    gzip_static always;

    types {
        text/html                html;
        text/javascript          js;
        application/wasm         wasm;
        application/octet-stream pck;
        image/png                png;
        image/svg+xml            svg;
        application/json         json;
    }
    default_type application/octet-stream;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location ~* \.(wasm|pck|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
