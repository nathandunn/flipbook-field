server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.wasm is 41 MB raw and 9 MB gzipped. The .gz files are built ahead of
    # time and served directly - compressing 41 MB per request would be absurd.
    # "always": serve the precompressed .gz whatever the client asked for. The
    # reverse proxy in front does not reliably pass Accept-Encoding through, and
    # every browser that can run a Godot 4 wasm build accepts gzip.
    gzip_static always;

    types {
        text/html                html;
        text/javascript          js;
        application/wasm         wasm;
        application/octet-stream pck;
        image/png                png;
        image/svg+xml            svg;
        application/json         json;
    }
    default_type application/octet-stream;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # These filenames never change but their contents change every deploy, so a
    # max-age here serves stale game code after a fix. no-cache still lets the
    # browser keep the 9 MB wasm - it just has to revalidate, and an unchanged
    # file comes back as a 304 with no body.
    location ~* \.(wasm|pck|js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
